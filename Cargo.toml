[package]
name = "solana-hawk512"
authors = ["Dean Little <@deanmlittle>"]
version = "0.1.0"
edition = "2024"
description = "Pure-Rust HAWK-512 signature verification, optimised for Solana SBF programs."
repository = "https://github.com/blueshift-gg/solana-hawk512"
license = "MIT"
keywords = ["hawk", "post-quantum", "signature", "solana", "no-std"]
categories = ["cryptography", "no-std"]
readme = "README.md"

# Keep the published tarball lean. Maintainer-only sources — Kani
# harnesses and the Lean formal-verification proofs — live under
# `internal-tests/` and `formal_verification/`, pulled in via
# `#[cfg(kani)] #[path = "../internal-tests/..."]` declarations in
# `src/lib.rs`. `cargo kani` on the published tarball won't run (test
# files absent by design); Kani is intended to run from the git
# checkout.
exclude = [
    "internal-tests",
    "formal_verification",
    ".github",
]

[lib]

[workspace]
members = [
    "host-tests",
    "program",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
solana-program-error = "3.0.1"
solana-shake256 = "0.1.0"
